name: tencent_flutter_live
description: Example app for nosmai_tencent_live - Nosmai effects livestreamed through Tencent RTC.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  # Nosmai effects + Tencent RTC livestreaming; no native code in this app.
  nosmai_tencent_live:
    path: packages/nosmai_tencent_live
  wakelock_plus: 1.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0

flutter:
  # PLAIN_FLUTTER_RUN_V1: temporary QA UserSigs; not production secrets.
  assets:
    - config/host.json
    - config/viewer.json
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  