name: tencent_flutter_live
description: A small Android and iOS Tencent TRTC host/viewer livestreaming app.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  tencent_rtc_sdk: 13.5.2
  nosmai_effects_sdk: 2.0.2
  permission_handler: 12.0.1
  wakelock_plus: 1.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0

flutter:
  # PLAIN_FLUTTER_RUN_V1: temporary QA UserSigs; not production secrets.
  assets:
    - config/host.json
    - config/viewer.json
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  